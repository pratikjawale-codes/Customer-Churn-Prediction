[project]
name = "telecom-customer-churn-prediction"
version = "0.1.0"
description = "Synthetic-data telecom customer churn modeling and prediction API"
readme = "README.md"
authors = [
    { name = "pratikjawale-codes", email = "psjawale79@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "waitress>=3.0,<4",
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "lightgbm>=4.3,<5",
    "catboost>=1.2,<2",
    "mlflow>=2.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
telecom-churn-train = "run_pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "data"]

[tool.setuptools.package-data]
"src.templates" = ["*.html"]
"src.static" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
